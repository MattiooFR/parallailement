# Lu par deploy/ship.sh (Mac et serveur). Les NEXT_PUBLIC_* (publiques) sont lues dans
# ~/apps/parallailement/build.env sur le serveur et passées au build.
APP=parallailement
IMAGES=(web)
HEALTH=("3066 /")
build_images() {
  local a=() k v
  while IFS='=' read -r k v; do
    [[ "$k" =~ ^NEXT_PUBLIC_[A-Z_]+$ ]] || continue
    v="${v#\'}"; v="${v%\'}"; a+=(--build-arg "$k=$v")
  done < "$HOME/apps/$APP/build.env"
  docker buildx build --builder "$APP" --load -f deploy/Dockerfile --target web "${a[@]}" -t "$APP-web:$1" site
}
