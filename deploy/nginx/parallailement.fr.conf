# /etc/nginx/sites-available/parallailement.fr.conf sur `prod`, installé par deploy/ship.sh.
# Origine verrouillée : ufw n'ouvre 80/443 qu'à Cloudflare, et $from_cloudflare (conf.d/00-cloudflare.conf,
# geo sur $realip_remote_addr) refuse tout le reste. Certificat : Cloudflare Origin CA (SSL Full strict).
server {
    listen 80;
    server_name parallailement.fr www.parallailement.fr;
    location / {
        if ($from_cloudflare = 0) { return 403; }
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name parallailement.fr www.parallailement.fr;
    ssl_certificate /etc/nginx/certs/parallailement.fr/cert.pem;
    ssl_certificate_key /etc/nginx/certs/parallailement.fr/key.pem;

    if ($from_cloudflare = 0) { return 403; }
    if ($host = www.parallailement.fr) { return 301 https://parallailement.fr$request_uri; }
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3066;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_read_timeout 300s;
    }
}
